version: '3.8'

services:
  repomind-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind-app
    volumes:
      - .:/app
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - repomind-net

  ollama:
    image: ollama/ollama:latest
    container_name: repomind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - repomind-net

networks:
  repomind-net:
    driver: bridge

volumes:
  ollama_data:

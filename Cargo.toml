[package]
name = "repomind"
version = "0.1.0"
edition = "2021"
authors = ["RepoMind Contributor"]
description = "A high-performance CLI RAG tool written in Rust for repository indexing and AI-powered code Q&A."
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
walkdir = "2.4"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
futures = "0.3"
